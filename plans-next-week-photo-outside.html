<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plans next week?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #140E0A;
    --bg-glow: #2A1B10;
    --card: #221810;
    --card-border: #4A3423;
    --gold: #C89B4A;
    --gold-bright: #E7BA71;
    --cream: #F3E8D8;
    --muted: #A6907A;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body{
    background:
      radial-gradient(ellipse 700px 500px at 50% 30%, var(--bg-glow) 0%, transparent 65%),
      var(--bg);
    font-family: var(--font-body);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card{
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 32px 36px;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 70px rgba(200,155,74,.06);
    text-align: center;
    overflow: hidden;
  }

  .photo-frame{
    margin: -40px -32px 22px;
    height: 220px;
    overflow: hidden;
    border-radius: 20px 20px 0 0;
    position: relative;
  }
  .photo-frame img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-frame::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,14,10,0) 55%, var(--card) 100%);
  }

  #stage h1{
    font-family: var(--font-display);
    font-weight: 560;
    font-size: clamp(25px, 6vw, 32px);
    line-height: 1.18;
    letter-spacing: -0.01em;
    margin: 0;
  }

  #stage p{
    color: var(--muted);
    font-size: 15.5px;
    line-height: 1.55;
    margin: 12px 0 0;
  }

  .actions{
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  button{ font: inherit; }

  .btn-primary{
    background: var(--gold);
    color: #1B140D;
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .btn-primary:hover{ background: var(--gold-bright); transform: translateY(-1px); }
  .btn-primary:active{ transform: translateY(0); }
  .btn-primary:disabled{ opacity: .4; cursor: not-allowed; transform: none; }

  .btn-text{
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 14px 10px;
    transition: color .15s ease;
  }
  .btn-text:hover{ color: var(--cream); }

  button:focus-visible{
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
    border-radius: 8px;
  }

  .days{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 26px;
  }
  @media (max-width: 380px){ .days{ grid-template-columns: repeat(3, 1fr); } }

  .day-chip{
    background: rgba(255,255,255,.02);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 4px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .day-chip:hover{ border-color: var(--gold); }
  .day-chip .wd{ display: block; font-weight: 600; font-size: 13px; color: var(--cream); }
  .day-chip .md{ display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .day-chip.selected{
    border-color: var(--gold);
    background: rgba(200,155,74,.14);
    box-shadow: 0 0 0 1px var(--gold) inset;
  }
  .day-chip.selected .wd, .day-chip.selected .md{ color: var(--cream); }

  .hint{ margin-top: 14px; font-size: 12.5px; color: var(--muted); opacity: .8; }

  .lock-in-row{ margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }

  .summary-list{ margin-top: 26px; text-align: left; }
  .summary-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .summary-row:last-child{ border-bottom: none; }
  .summary-row .label{ font-weight: 600; font-size: 14.5px; color: var(--cream); }
  .summary-row .value{ font-size: 14px; color: var(--muted); text-align: right; }

  .footnote{ margin-top: 22px; font-size: 12.5px; color: var(--muted); opacity: .75; }

  .sparkle{
    position: absolute;
    width: 4px; height: 4px;
    background: var(--gold-bright);
    border-radius: 50%;
    opacity: 0;
    animation: rise 1.6s ease-out forwards;
  }
  @keyframes rise{
    0%   { opacity: 0; transform: translateY(0) scale(.6); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-70px) scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce){ .sparkle{ display: none; } }


  /* Playful photo treatment */
  .photo-frame{
    isolation: isolate;
    background: #1B120C;
    box-shadow: inset 0 -1px 0 rgba(243,232,216,.08);
  }

  .photo-frame img{
    position: relative;
    z-index: 1;
    transform: scale(1.045) rotate(-.25deg);
    filter: saturate(1.10) contrast(1.04) brightness(1.01);
    transition: filter .35s ease, transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
  }

  .photo-frame[data-activity="dinner"] img{
    transform: scale(1.055) rotate(-.45deg);
    filter: saturate(1.12) contrast(1.05) brightness(.99) sepia(.06);
  }

  .photo-frame[data-activity="breakfast"] img{
    transform: scale(1.05) rotate(.35deg);
    filter: saturate(1.08) contrast(1.02) brightness(1.06) sepia(.035);
  }

  .photo-frame[data-activity="swim"] img{
    transform: scale(1.06) rotate(-.2deg);
    filter: saturate(1.18) contrast(1.05) brightness(1.035);
  }

  .photo-frame::before{
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: .25;
    background:
      radial-gradient(circle at 17% 24%, rgba(255,255,255,.20) 0 1px, transparent 1.5px),
      radial-gradient(circle at 72% 32%, rgba(255,255,255,.14) 0 1px, transparent 1.4px),
      radial-gradient(circle at 43% 74%, rgba(255,255,255,.13) 0 1px, transparent 1.4px),
      radial-gradient(circle at 82% 81%, rgba(255,255,255,.12) 0 1px, transparent 1.4px);
    background-size: 31px 31px, 43px 43px, 37px 37px, 53px 53px;
    mix-blend-mode: screen;
  }

  .photo-frame::after{
    z-index: 3;
    background:
      linear-gradient(180deg, rgba(20,14,10,.02) 35%, rgba(20,14,10,.12) 62%, var(--card) 100%),
      linear-gradient(115deg, rgba(231,186,113,.10), transparent 42%);
  }

  .photo-tape{
    position: absolute;
    z-index: 5;
    width: 68px;
    height: 20px;
    top: 10px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(238,210,161,.48);
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .photo-badge{
    position: absolute;
    z-index: 5;
    left: 17px;
    bottom: 20px;
    padding: 7px 11px 7px;
    border-radius: 7px;
    border: 1px solid rgba(49,34,22,.18);
    background: rgba(247,236,219,.94);
    color: #2B1D13;
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    box-shadow: 0 8px 20px rgba(0,0,0,.22);
    transform: rotate(-3deg);
    transform-origin: center;
  }

  .photo-frame[data-activity="breakfast"] .photo-badge{ transform: rotate(2.5deg); }
  .photo-frame[data-activity="swim"] .photo-badge{ transform: rotate(-1.5deg); }

  .photo-doodle{
    position: absolute;
    z-index: 5;
    right: 17px;
    bottom: 23px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    color: var(--cream);
    font-family: var(--font-display);
    font-size: 31px;
    line-height: 1;
    text-shadow: 0 3px 12px rgba(0,0,0,.45);
    transform: rotate(10deg);
    user-select: none;
  }

  .photo-frame[data-activity="breakfast"] .photo-doodle{
    transform: rotate(-8deg);
    font-size: 35px;
  }

  .photo-frame[data-activity="swim"] .photo-doodle{
    width: 55px;
    transform: rotate(-5deg);
    font-size: 29px;
    letter-spacing: -3px;
  }

  .photo-frame.photo-pop .photo-badge,
  .photo-frame.photo-pop .photo-doodle{
    animation: photoPop .42s cubic-bezier(.2,.9,.25,1.2) both;
  }

  @keyframes photoPop{
    0%{ opacity: 0; transform: translateY(9px) rotate(0deg) scale(.88); }
    100%{ opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    .photo-frame img{ transition: none; }
    .photo-frame.photo-pop .photo-badge,
    .photo-frame.photo-pop .photo-doodle{ animation: none; }
  }


  /* Photo rework: separate snapshot, fully visible, no text overlay */
  body{
    align-items: flex-start;
    padding-top: 34px;
    padding-bottom: 48px;
  }

  .page-wrap{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .card{
    width: 100%;
    max-width: 420px;
    padding: 34px 32px 36px;
    overflow: visible;
  }

  .photo-frame{
    margin: 0;
    width: min(350px, calc(100vw - 58px));
    height: auto;
    aspect-ratio: 4 / 3;
    padding: 9px;
    overflow: visible;
    border: 0;
    border-radius: 11px;
    background: #F3E8D8;
    box-shadow: 0 20px 45px rgba(0,0,0,.38), 0 3px 0 rgba(255,255,255,.08);
    transform: rotate(-1.4deg);
    transform-origin: center;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }

  .photo-frame[data-activity="breakfast"]{ transform: rotate(1.25deg); }
  .photo-frame[data-activity="swim"]{ transform: rotate(-.55deg); }

  .photo-frame img,
  .photo-frame[data-activity="dinner"] img,
  .photo-frame[data-activity="breakfast"] img,
  .photo-frame[data-activity="swim"] img{
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 6px;
    transform: none;
    filter: saturate(1.06) contrast(1.02) brightness(1.02);
  }

  .photo-frame::before,
  .photo-frame::after{
    display: none;
  }

  .photo-tape{
    z-index: 4;
    width: 72px;
    height: 19px;
    top: -8px;
    left: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(231,186,113,.58);
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
  }

  .photo-doodle{
    z-index: 5;
    right: -19px;
    bottom: -14px;
    width: 48px;
    height: 48px;
    color: var(--gold-bright);
    font-size: 35px;
    text-shadow: 0 5px 14px rgba(0,0,0,.48);
    pointer-events: none;
  }

  .photo-frame[data-activity="breakfast"] .photo-doodle{
    right: -17px;
    bottom: -13px;
    font-size: 39px;
  }

  .photo-frame[data-activity="swim"] .photo-doodle{
    right: -24px;
    bottom: -10px;
    width: 64px;
    font-size: 31px;
  }

  .photo-frame.photo-pop{
    animation: snapshotPop .38s cubic-bezier(.2,.9,.25,1.12);
  }

  @keyframes snapshotPop{
    0%{ opacity: .72; scale: .975; }
    100%{ opacity: 1; scale: 1; }
  }

  @media (max-width: 380px){
    body{ padding: 26px 18px 42px; }
    .page-wrap{ gap: 16px; }
    .photo-frame{ width: min(326px, calc(100vw - 48px)); }
    .card{ padding: 30px 22px 32px; }
  }

  @media (prefers-reduced-motion: reduce){
    .photo-frame.photo-pop{ animation: none; }
  }

</style>
</head>

  ];

  const photoVibes = {
    dinner:    { doodle: '✦' },
    breakfast: { doodle: '☼' },
    swim:      { doodle: '≈≈' }
  };


  let currentIndex = 0;
  let currentScreen = 'ask';
  let selectedByActivity = {};
  activities.forEach(a => selectedByActivity[a.key] = new Set());
  let responses = {};

  let weekDates = computeNextWeekDates();

  function computeNextWeekDates(){
    const today = new Date();
    const dow = today.getDay();
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    const thisMonday = new Date(today);
    thisMonday.setDate(today.getDate() + diffToMonday);
    const nextMonday = new Date(thisMonday);
    nextMonday.setDate(thisMonday.getDate() + 7);

    const wdFmt = new Intl.DateTimeFormat('en-US', { weekday: 'short' });
    const mdFmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });

    const days = [];
    for(let i=0;i<7;i++){
      const d = new Date(nextMonday);
      d.setDate(nextMonday.getDate() + i);
      days.push({ short: wdFmt.format(d), md: mdFmt.format(d), dnum: d.getDate(), year: d.getFullYear(), month: d.getMonth(), date: d.getDate() });
    }
    return days;
  }

  function activity(){ return activities[currentIndex]; }

  function tmplAsk(a){
    return `
      <h1>${a.askHeadline}</h1>
      <p>${a.askSub}</p>
      <div class="actions">
        <button class="btn-primary" data-action="go-daypicker">yes</button>
        <button class="btn-text" data-action="go-confirm1">not this time</button>
      </div>
    `;
  }

  function tmplConfirm1(){
    return `
      <h1>Wait, really?</h1>
      <p>You sure about that?</p>
      <div class="actions">
        <button class="btn-primary" data-action="go-daypicker">okay, yes</button>
        <button class="btn-text" data-action="go-confirm2">yeah, really</button>
      </div>
    `;
  }

  function tmplConfirm2(){
    return `
      <h1>Hm. Last chance.</h1>
      <p>Just checking.</p>
      <div class="actions">
        <button class="btn-primary" data-action="go-daypicker">alright, yes</button>
        <button class="btn-text" data-action="go-confirm3">still no</button>
      </div>
    `;
  }

  function tmplConfirm3(){
    return `
      <h1>Okay. I hear you.</h1>
      <p>The offer's open if you change your mind.</p>
      <div class="actions">
        <button class="btn-primary" data-action="go-daypicker">actually, yes</button>
        <button class="btn-text" data-action="go-declined">no, really no</button>
      </div>
    `;
  }

  function tmplDeclined(a){
    return `
      <h1>No ${a.label.toLowerCase()}, got it.</h1>
      <p>Next time, then.</p>
      <div class="actions">
        <button class="btn-primary" data-action="finish-decline">okay, next</button>
        <button class="btn-text" data-action="go-daypicker">wait, actually, yes</button>
      </div>
    `;
  }

  function tmplDaypicker(a){
    const set = selectedByActivity[a.key];
    const options = weekDates
      .map((d, i) => ({ d, i }))
      .filter(({ d }) => !a.allowedDays || a.allowedDays.includes(d.short));
    return `
      <h1>Which days for ${a.label.toLowerCase()}?</h1>
      <p>Pick as many as you like.</p>
      <div class="days">
        ${options.map(({ d, i }) => `
          <button
            class="day-chip${set.has(i) ? ' selected' : ''}"
            data-action="toggle-day"
            data-index="${i}"
            aria-pressed="${set.has(i)}"
          >
            <span class="wd">${d.short}</span>
            <span class="md">${d.md}</span>
          </button>
        `).join('')}
      </div>
      <div class="lock-in-row">
        <button class="btn-primary" data-action="lock-in" ${set.size === 0 ? 'disabled' : ''}>
          lock it in${set.size ? ` (${set.size})` : ''}
        </button>
        <button class="btn-text" data-action="finish-decline">skip ${a.label.toLowerCase()}</button>
      </div>
    `;
  }

  function tmplSummary(data){
    const rows = activities.map(a => {
      const r = data[a.key];
      const value = (r && r.status === 'confirmed')
        ? r.days.map(d => d.label).join(', ')
        : 'no thanks';
      return `
        <div class="summary-row">
          <span class="label">${a.label}</span>
          <span class="value">${value}</span>
        </div>
      `;
    }).join('');

    const hasConfirmed = activities.some(a => data[a.key] && data[a.key].status === 'confirmed');

    return `
      <h1>Here's the plan.</h1>
      <div class="summary-list">${rows}</div>
      ${hasConfirmed ? `
        <div class="lock-in-row">
          <button class="btn-primary" data-action="download-ics">add to calendar</button>
        </div>
        <p class="footnote">defaults: dinner 7pm · breakfast 7am · swim 4pm — edit the time after adding</p>
      ` : ''}
      <p class="footnote">saved — reopen this link anytime to check it</p>
      <p class="footnote"><button class="btn-text" data-action="reset" style="padding:0;font-size:12.5px;">start over</button></p>
    `;
  }

  const defaultTimes = {
    dinner:    { hour: 19, minute: 0 },
    breakfast: { hour: 7,  minute: 0 },
    swim:      { hour: 16, minute: 0 }
  };

  function pad2(n){ return n.toString().padStart(2, '0'); }

  function icsLocalDateTime(day, hour, minute, addMinutes){
    const d = new Date(day.year, day.month, day.date, hour, minute + (addMinutes || 0), 0);
    return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  }

  function icsStamp(){
    return new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  }

  function buildAndDownloadICS(data){
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Plans Next Week//EN', 'CALSCALE:GREGORIAN'];

    activities.forEach(a => {
      const r = data[a.key];
      if(!r || r.status !== 'confirmed') return;
      const t = defaultTimes[a.key];
      r.days.forEach(day => {
        const uid = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + Math.random().toString(36).slice(2))) + '@plans-next-week';
        lines.push('BEGIN:VEVENT');
        lines.push('UID:' + uid);
        lines.push('DTSTAMP:' + icsStamp());
        lines.push('DTSTART:' + icsLocalDateTime(day, t.hour, t.minute));
        lines.push('DTEND:' + icsLocalDateTime(day, t.hour, t.minute, 60));
        lines.push('SUMMARY:' + a.label);
        lines.push('END:VEVENT');
      });
    });

    lines.push('END:VCALENDAR');
    const icsContent = lines.join('\r\n');
    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'plans-next-week.ics';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function render(){
    const a = activity();
    const heroPhoto = document.getElementById('hero-photo');
    const photoFrame = document.getElementById('photo-frame');
    const photoDoodle = document.getElementById('photo-doodle');
    if(heroPhoto){
      heroPhoto.src = a.photo;
      heroPhoto.style.objectPosition = a.photoPosition || 'center 35%';
    }
    if(photoFrame){
      const vibe = photoVibes[a.key] || photoVibes.dinner;
      photoFrame.dataset.activity = a.key;
      if(photoDoodle) photoDoodle.textContent = vibe.doodle;
      photoFrame.classList.remove('photo-pop');
      void photoFrame.offsetWidth;
      photoFrame.classList.add('photo-pop');
    }
    if(currentScreen === 'ask') stageInner.innerHTML = tmplAsk(a);
    else if(currentScreen === 'confirm1') stageInner.innerHTML = tmplConfirm1();
    else if(currentScreen === 'confirm2') stageInner.innerHTML = tmplConfirm2();
    else if(currentScreen === 'confirm3') stageInner.innerHTML = tmplConfirm3();
    else if(currentScreen === 'declined') stageInner.innerHTML = tmplDeclined(a);
    else if(currentScreen === 'daypicker') stageInner.innerHTML = tmplDaypicker(a);
  }

  function renderSummary(data){
    stageInner.innerHTML = tmplSummary(data);
    burstSparkles();
  }

  function burstSparkles(){
    const rect = cardEl.getBoundingClientRect();
    for(let i=0;i<10;i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = (30 + Math.random() * (rect.width - 60)) + 'px';
      s.style.top = (rect.height * 0.3 + Math.random() * 40) + 'px';
      s.style.animationDelay = (Math.random() * 0.4) + 's';
      cardEl.appendChild(s);
      setTimeout(() => s.remove(), 2200);
    }
  }

  function advance(){
    currentIndex += 1;
    currentScreen = 'ask';
    if(currentIndex >= activities.length){
      saveAndShowSummary();
    } else {
      render();
    }
  }

  async function saveAndShowSummary(){
    await saveResponses(responses);
    renderSummary(responses);
  }

  async function saveResponses(data){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(data), true);
    }catch(e){
      console.error('Could not save responses:', e);
    }
  }

  async function clearResponses(){
    try{
      await window.storage.delete(STORAGE_KEY, true);
    }catch(e){
      console.error('Could not clear responses:', e);
    }
  }

  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const a = activity();

    if(action === 'go-daypicker'){ currentScreen = 'daypicker'; render(); }
    else if(action === 'go-confirm1'){ currentScreen = 'confirm1'; render(); }
    else if(action === 'go-confirm2'){ currentScreen = 'confirm2'; render(); }
    else if(action === 'go-confirm3'){ currentScreen = 'confirm3'; render(); }
    else if(action === 'go-declined'){ currentScreen = 'declined'; render(); }
    else if(action === 'toggle-day'){
      const idx = parseInt(el.dataset.index, 10);
      const set = selectedByActivity[a.key];
      if(set.has(idx)) set.delete(idx); else set.add(idx);
      render();
    }
    else if(action === 'lock-in'){
      const set = selectedByActivity[a.key];
      if(set.size === 0) return;
      const days = Array.from(set).sort((x,y) => x-y).map(i => ({
        label: `${weekDates[i].short} ${weekDates[i].dnum}`,
        year: weekDates[i].year,
        month: weekDates[i].month,
        date: weekDates[i].date
      }));
      responses[a.key] = { status: 'confirmed', days };
      advance();
    }
    else if(action === 'finish-decline'){
      responses[a.key] = { status: 'declined' };
      advance();
    }
    else if(action === 'download-ics'){
      buildAndDownloadICS(responses);
    }
    else if(action === 'reset'){
      currentIndex = 0;
      currentScreen = 'ask';
      responses = {};
      activities.forEach(act => selectedByActivity[act.key] = new Set());
      await clearResponses();
      render();
    }
  });

  (async function init(){
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      if(res && res.value){
        const data = JSON.parse(res.value);
        renderSummary(data);
        return;
      }
    }catch(e){
      // no existing response yet — start fresh
    }
    render();
  })();
</script>

</body>
</html>
